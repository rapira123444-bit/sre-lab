name: SRE Lab CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checlout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install kubernetes

      - name: Lint Python scripts
        run: |
          python3 -m py_compile 03-python-autoheal/autoheal.ry

      - name: Check Bash scripts
        run: |
          bash -n 02-bash/check_k8s.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init and Validate (05-terraform-k8s)
        run: |
          cd 05-terraform-k8s
          terraform init -backend=false
          terraform validate
